<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> <!-- Link para o arquivo CSS -->
    <title>exercícios de JavaScript</title>
</head>
<body>
    <h1>Painel de Exercícios</h1>
    
    <!-- Criando botões dinamicamente para não escrever 20 vezes no HTML -->
    <section id="button-section">
        <div id="menu"></div>
    </section>
    <script src="main.js"></script>
    <script>
        const menu = document.getElementById('menu');
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.innerText = `Ex ${i}`;
            btn.onclick = () => carregarExercicio(i);
            menu.appendChild(btn);
        }
    </script>
</body>
</html>
