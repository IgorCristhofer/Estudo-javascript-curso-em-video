<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            background-color: #d7f8f1;
            color: #242424;
            padding: 20px;
        }
        h1 {
            padding: 8px;
            border-radius: 12px;
            color: #d2e9ff;
            background-color: #2c3e50;
        }
    </style>
    <title>exercícios de JavaScript</title>
</head>
<body>
    <h1>Painel de Exercícios</h1>
    
    <!-- Criando botões dinamicamente para não escrever 20 vezes no HTML -->
    <div id="menu"></div>
    <script src="main.js"></script>
    <script>
        const menu = document.getElementById('menu');
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.innerText = `Ex ${i}`;
            btn.onclick = () => carregarExercicio(i);
            menu.appendChild(btn);
        }
    </script>
</body>
</html>
